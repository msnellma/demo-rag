services:
  pgvector:
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5432:5432'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/demo-rag:rag
    ports:
      - '8082:8082'
    depends_on:
      - pgvector